<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %} - BTC马丁策略</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b'
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-primary">BTC马丁策略</a>
                    <div class="flex space-x-4">
                        <a href="/" class="nav-link px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 {% if request.url.path == '/' %}bg-gray-700{% endif %}">
                            交易状态
                        </a>
                        <a href="/trades" class="nav-link px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 {% if request.url.path == '/trades' %}bg-gray-700{% endif %}">
                            交易记录
                        </a>
                        <a href="/config" class="nav-link px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700 {% if request.url.path == '/config' %}bg-gray-700{% endif %}">
                            策略配置
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="navPrice" class="text-sm text-gray-400">BTC: --</span>
                    <span id="navStatus" class="px-2 py-1 text-xs rounded bg-success">模拟中</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 border-t border-gray-700 mt-8">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="text-center text-sm text-gray-500">
                BTC马丁格尔策略交易系统 | 模拟交易模式
            </div>
        </div>
    </footer>

    <script>
        // 更新导航栏价格
        async function updateNavPrice() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('navPrice').textContent = 'BTC: $' + data.price.toFixed(2);
            } catch (e) {
                console.log('Failed to update price');
            }
        }
        updateNavPrice();
        setInterval(updateNavPrice, 3000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
