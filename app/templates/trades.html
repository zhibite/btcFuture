{% extends "base.html" %}

{% block content %}
<div class="bg-gray-800 rounded-lg p-6 border border-gray-700 mb-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-semibold">交易记录</h2>
        <button onclick="refreshTrades()" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white rounded-lg text-sm">
            刷新
        </button>
    </div>

    <!-- 统计摘要 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 p-4 bg-gray-700 rounded-lg">
        <div>
            <div class="text-sm text-gray-400">总交易次数</div>
            <div id="sumTotal" class="text-xl font-bold">0</div>
        </div>
        <div>
            <div class="text-sm text-gray-400">盈利次数</div>
            <div id="sumProfit" class="text-xl font-bold text-success">0</div>
        </div>
        <div>
            <div class="text-sm text-gray-400">亏损次数</div>
            <div id="sumLoss" class="text-xl font-bold text-danger">0</div>
        </div>
        <div>
            <div class="text-sm text-gray-400">胜率</div>
            <div id="sumWinRate" class="text-xl font-bold">--%</div>
        </div>
    </div>

    <!-- 交易列表 -->
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-700">
                <tr>
                    <th class="px-4 py-3 text-left">时间</th>
                    <th class="px-4 py-3 text-left">类型</th>
                    <th class="px-4 py-3 text-left">方向</th>
                    <th class="px-4 py-3 text-right">数量</th>
                    <th class="px-4 py-3 text-right">价格</th>
                    <th class="px-4 py-3 text-right">盈亏</th>
                    <th class="px-4 py-3 text-right">手续费</th>
                    <th class="px-4 py-3 text-right">净盈亏</th>
                </tr>
            </thead>
            <tbody id="tradesBody" class="divide-y divide-gray-700">
                <tr>
                    <td colspan="8" class="px-4 py-8 text-center text-gray-500">暂无交易记录</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 每日统计 -->
<div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
    <h2 class="text-lg font-semibold mb-4">每日统计</h2>
    <div id="dailyStats" class="space-y-2">
        <div class="text-gray-500 text-center py-4">暂无数据</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function refreshTrades() {
        try {
            const res = await fetch('/api/trades');
            const data = await res.json();
            updateTrades(data);
        } catch (e) {
            console.error('Failed to fetch trades:', e);
        }
    }

    function updateTrades(data) {
        // 更新摘要。summary 在内存路径下字段为 total_trades/profit_trades/loss_trades，
        // 兼容旧的 closed_trades/win_count/loss_count 命名。
        const sum = data.summary || {};
        const total = sum.total_trades ?? sum.closed_trades ?? 0;
        const profit = sum.profit_trades ?? sum.win_count ?? 0;
        const loss = sum.loss_trades ?? sum.loss_count ?? 0;
        document.getElementById('sumTotal').textContent = total || 0;
        document.getElementById('sumProfit').textContent = profit || 0;
        document.getElementById('sumLoss').textContent = loss || 0;

        const winRate = sum.win_rate ? (sum.win_rate * 100).toFixed(1) : '0';
        document.getElementById('sumWinRate').textContent = winRate + '%';

        // 更新交易列表
        const tbody = document.getElementById('tradesBody');
        if (data.trades && data.trades.length > 0) {
            tbody.innerHTML = data.trades.map(trade => {
                const typeClass = trade.type === 'open' ? 'bg-blue-500' :
                                 trade.type === 'add' ? 'bg-yellow-500' :
                                 trade.type === 'take_profit' ? 'bg-green-600' :
                                 trade.type === 'close' ? 'bg-gray-500' :
                                 trade.type === 'stop_loss' ? 'bg-red-500' : 'bg-gray-500';
                const typeText = trade.type === 'open' ? '开仓' :
                                trade.type === 'add' ? '加仓' :
                                trade.type === 'take_profit' ? '止盈' :
                                trade.type === 'close' ? '平仓' :
                                trade.type === 'stop_loss' ? '止损' : trade.type;

                const sideText = trade.side === 'buy' ? '买入' : '卖出';
                const sideClass = trade.side === 'buy' ? 'text-success' : 'text-danger';

                const pnl = trade.net_pnl || 0;
                const pnlClass = pnl >= 0 ? 'text-success' : 'text-danger';

                return `
                    <tr class="hover:bg-gray-700">
                        <td class="px-4 py-3">${trade.timestamp}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-xs ${typeClass}">${typeText}</span>
                        </td>
                        <td class="px-4 py-3 ${sideClass}">${sideText}</td>
                        <td class="px-4 py-3 text-right">${trade.size.toFixed(4)}</td>
                        <td class="px-4 py-3 text-right">$${trade.price.toFixed(2)}</td>
                        <td class="px-4 py-3 text-right ${pnlClass}">${(trade.pnl || 0).toFixed(2)}</td>
                        <td class="px-4 py-3 text-right">${(trade.fee || 0).toFixed(2)}</td>
                        <td class="px-4 py-3 text-right font-bold ${pnlClass}">${pnl.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">暂无交易记录</td></tr>';
        }
    }

    refreshTrades();
    setInterval(refreshTrades, 5000);
</script>
{% endblock %}
